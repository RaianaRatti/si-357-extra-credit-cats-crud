{% extends "base_bootstrap.html" %}

{% block content %}
<form method="post">
  {% csrf_token %}
  Are you sure you want to delete "{{ breed }}"?
  This will also delete every cat of this breed.
  <input type="submit" value="Yes, delete.">
  <a href="{% url 'cats:all' %}">Cancel</a>
</form>
{% endblock %}
